<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste - Atendimento do Restaurante</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.chat-container{width:100%;max-width:500px;background:white;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);overflow:hidden}
.header{background:#e74c3c;color:white;padding:20px;text-align:center}
.header h1{font-size:1.3rem;margin-bottom:5px}
.header p{font-size:0.85rem;opacity:0.9}
.status{display:inline-flex;align-items:center;gap:6px;font-size:0.8rem;margin-top:8px}
.status-dot{width:8px;height:8px;background:#2ecc71;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.messages{height:500px;overflow-y:auto;padding:20px;background:#f8f9fa;display:flex;flex-direction:column;gap:12px}
.message{max-width:80%;padding:12px 16px;border-radius:18px;font-size:0.95rem;line-height:1.4;word-wrap:break-word}
.message.user{align-self:flex-end;background:#e74c3c;color:white;border-bottom-right-radius:4px}
.message.bot{align-self:flex-start;background:white;color:#333;border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.message.typing{background:white;color:#999;font-style:italic}
.input-area{display:flex;padding:15px;background:white;border-top:1px solid #eee}
.input-area input{flex:1;padding:12px 16px;border:2px solid #eee;border-radius:25px;outline:none;font-size:0.95rem}
.input-area input:focus{border-color:#e74c3c}
.input-area button{margin-left:10px;padding:12px 20px;background:#e74c3c;color:white;border:none;border-radius:25px;cursor:pointer;font-weight:600}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px;background:white;border-top:1px solid #eee}
.suggestion-chip{padding:8px 14px;background:#f0f0f0;border-radius:20px;font-size:0.85rem;cursor:pointer;border:none;color:#333}
.suggestion-chip:hover{background:#e74c3c;color:white}
.welcome-msg{text-align:center;color:#666;margin:20px 0}
</style>
</head>
<body>
<div class="chat-container">
<div class="header">
<h1>Restaurante Sabor & Arte</h1>
<p>Atendimento Inteligente 24h</p>
<div class="status"><div class="status-dot"></div><span>Online - Respondendo automaticamente</span></div>
<div class="messages" id="messages">
<div class="welcome-msg">
<p>Bem-vindo! Teste nosso atendimento automatico.</p>
<p style="font-size:0.85rem;margin-top:8px;">Clique em uma sugestao abaixo ou digite sua pergunta.</p>
</div>
<div class="suggestions">
<button class="suggestion-chip" onclick="sendSuggestion('Quero reservar uma mesa para 4 pessoas sabado as 20h')">Reservar mesa</button>
<button class="suggestion-chip" onclick="sendSuggestion('Qual o cardapio de hoje?')">Cardapio</button>
<button class="suggestion-chip" onclick="sendSuggestion('Quanto custa a pizza de calabresa?')">Precos</button>
<button class="suggestion-chip" onclick="sendSuggestion('Voce entregam no bairro Centro?')">Entrega</button>
<button class="suggestion-chip" onclick="sendSuggestion('Quero fazer um pedido')">Fazer pedido</button>
</div>
<div class="input-area">
<input type="text" id="userInput" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">Enviar</button>
</div>

<script>
function addMessage(text, isUser){
    const div = document.createElement('div');
    div.className = 'message ' + (isUser ? 'user' : 'bot');
    div.innerHTML = text.replace(/\n/g, '<br>');
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = 999999;
}
function showTyping(){
    const div = document.createElement('div');
    div.className = 'message typing';
    div.id = 'typing';
    div.textContent = 'Digitando...';
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = 999999;
}
function hideTyping(){
    const el = document.getElementById('typing');
    if(el) el.remove();
}
function getResponse(msg){
    const m = msg.toLowerCase();
    if(/reserv|mesa|lugares|pessoas|horario|sabado|domingo/.test(m)){
        return "Reserva Confirmada!\n\nMesa para 4 pessoas\nSabado as 20:00\nRestaurante Sabor & Arte\n\nSeu codigo: #RES-7842\n\nPolitica: pode cancelar ate 2h antes sem taxa.\n\nTe esperamos!";
    }
    if(/cardapio|menu|pratos|comida|hoje/.test(m)){
        return "Cardapio de Hoje\n\nPizzas:\n- Calabresa - R$ 45\n- Margherita - R$ 42\n- Quatro Queijos - R$ 48\n\nMassas:\n- Spaghetti Carbonara - R$ 38\n- Fettuccine Alfredo - R$ 40\n\nSaladas:\n- Caesar - R$ 28\n- Caprese - R$ 26\n\nSobremesas:\n- Tiramisu - R$ 18\n- Pudim - R$ 15\n\nQuer fazer um pedido ou reservar?";
    }
    if(/preco|custa|valor|quanto|dinheiro/.test(m)){
        return "Nossos Precos:\n\nPizza Calabresa: R$ 45\nPizza Margherita: R$ 42\nSpaghetti Carbonara: R$ 38\nSalada Caesar: R$ 28\n\nAceitamos: Pix, Cartao, Dinheiro\nTaxa de entrega: R$ 5 (gratis acima de R$ 60)";
    }
    if(/entrega|delivery|bairro|leva|envia/.test(m)){
        return "Entregamos nos bairros:\n- Centro (15-20 min)\n- Jardins (20-25 min)\n- Vila Nova (25-30 min)\n\nTaxa: R$ 5\nGratis para pedidos acima de R$ 60\n\nHorario de entrega: 18h as 23h";
    }
    if(/pedido|querer|quero|gostaria/.test(m)){
        return "Perfeito! Vou montar seu pedido.\n\nDigite os itens que deseja:\nExemplo: 1 pizza calabresa, 1 refrigerante\n\nDepois confirmo o total e geramos o link de pagamento.";
    }
    if(/oi|ola|bom dia|boa tarde|boa noite|hey|hello/.test(m)){
        return "Ola! Bem-vindo ao Restaurante Sabor & Arte! \n\nComo posso ajudar voce hoje?\n- Ver cardapio\n- Fazer reserva\n- Fazer pedido\n- Tirar duvidas";
    }
    return "Entendi! Para melhor atende-lo, poderia me dizer se voce quer:\n1. Ver nosso cardapio\n2. Fazer uma reserva\n3. Fazer um pedido\n4. Tirar uma duvida especifica\n\nEstou aqui para ajudar!";
}
function sendMessage(){
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if(!text) return;
    addMessage(text, true);
    input.value = '';
    showTyping();
    setTimeout(()=>{
        hideTyping();
        addMessage(getResponse(text), false);
    }, 800 + Math.random() * 700);
}
function sendSuggestion(text){
    document.getElementById('userInput').value = text;
    sendMessage();
}
</script>
</body>
</html>
